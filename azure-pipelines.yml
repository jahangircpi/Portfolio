# azure-pipelines.yml (updated)
trigger:
  branches:
    include:
      - main

# Key change: Use 'vmImage: ubuntu-20.04' (no parallelism needed)
pool:
  vmImage: 'ubuntu-20.04'
  demands: npm  # Ensures Node.js is available (for Flutter)

steps:
  - script: |
      sudo apt-get update
      sudo apt-get install -y curl unzip
      curl -O https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_3.19.5-stable.tar.xz
      tar xf flutter_linux_3.19.5-stable.tar.xz
      echo "$(pwd)/flutter/bin" >> $GITHUB_PATH
    displayName: 'Install Flutter'

  - script: flutter pub get
    displayName: 'Get Dependencies'

  - script: flutter build apk --release
    displayName: 'Build APK'

  - task: PublishBuildArtifacts@1
    inputs:
      pathtoPublish: 'build/app/outputs/flutter-apk/'
      artifactName: 'apk'