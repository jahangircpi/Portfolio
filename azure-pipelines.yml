# azure-pipelines.yml
trigger:
  branches:
    include:
      - main

pool:
  vmImage: 'ubuntu-20.04'

steps:
  # 1. Install dependencies
  - script: |
      sudo apt-get update
      sudo apt-get install -y curl unzip git libglu1-mesa
    displayName: 'Install System Dependencies'

  # 2. Install Flutter
  - script: |
      git clone https://github.com/flutter/flutter.git -b stable --depth 1
      echo "$(pwd)/flutter/bin" >> $GITHUB_PATH
    displayName: 'Install Flutter'

  # 3. Verify installation
  - script: flutter doctor -v
    displayName: 'Verify Flutter Installation'

  # 4. Get dependencies
  - script: flutter pub get
    displayName: 'Get Packages'

  # 5. Build APK
  - script: flutter build apk --release
    displayName: 'Build Release APK'

  # 6. Publish artifact (FIXED VERSION)
  - task: PublishBuildArtifacts@1
    inputs:
      pathtoPublish: 'build/app/outputs/flutter-apk/app-release.apk'
      artifactName: 'apk'